<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1160" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151922"/>
      <stop offset="1" stop-color="#0C1017"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#222934"/>
      <stop offset="1" stop-color="#171D26"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF6895"/>
      <stop offset="1" stop-color="#FF9A66"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7AA2FF"/>
      <stop offset="1" stop-color="#49D4FF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD57A"/>
      <stop offset="1" stop-color="#FF9B53"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <text x="80" y="100" fill="#F4F7FB" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Sunuculu Uygulama Icin Ikon Fikirleri</text>
  <text x="80" y="138" fill="#95A0B2" font-size="20" font-family="Segoe UI, Arial, sans-serif">Kalp yerine daha uygun, baglanti ve oda hissi veren alternatifler</text>

  <g transform="translate(70 190)">
    <rect width="260" height="430" rx="30" fill="url(#card)" stroke="#303A49"/>
    <rect x="62" y="46" width="136" height="136" rx="34" fill="#111720" stroke="#313A46"/>
    <g transform="translate(130 114)" filter="url(#shadow)">
      <circle cx="-42" cy="-30" r="14" fill="url(#rose)"/>
      <circle cx="44" cy="-12" r="14" fill="url(#rose)"/>
      <circle cx="-10" cy="42" r="14" fill="url(#rose)"/>
      <path d="M-30 -24L31 -14" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
      <path d="M-5 29L36 -1" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
      <path d="M-35 -14L-14 30" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
    </g>
    <text x="30" y="244" fill="#F7F8FB" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Baglanti Dugumu</text>
    <text x="30" y="286" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">Kisiler ayni sunucu icinde</text>
    <text x="30" y="315" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">birbirine baglaniyor hissi verir.</text>
    <text x="30" y="377" fill="#FFB8CB" font-size="17" font-family="Segoe UI, Arial, sans-serif">En net ve urunun mantigina en yakin</text>
  </g>

  <g transform="translate(370 190)">
    <rect width="260" height="430" rx="30" fill="url(#card)" stroke="#303A49"/>
    <rect x="62" y="46" width="136" height="136" rx="34" fill="#111720" stroke="#313A46"/>
    <g transform="translate(130 114)" filter="url(#shadow)">
      <circle r="12" fill="url(#blue)"/>
      <circle r="34" stroke="url(#blue)" stroke-width="10" opacity="0.95"/>
      <circle r="58" stroke="url(#blue)" stroke-width="10" opacity="0.7"/>
      <circle r="82" stroke="url(#blue)" stroke-width="10" opacity="0.42"/>
    </g>
    <text x="30" y="244" fill="#F7F8FB" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Dalga Halkasi</text>
    <text x="30" y="286" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">Sesli oda, canli baglanti ve</text>
    <text x="30" y="315" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">yayin hissini guclu verir.</text>
    <text x="30" y="377" fill="#B7D8FF" font-size="17" font-family="Segoe UI, Arial, sans-serif">Sesli taraf on plandaysa cok iyi</text>
  </g>

  <g transform="translate(670 190)">
    <rect width="260" height="430" rx="30" fill="url(#card)" stroke="#303A49"/>
    <rect x="62" y="46" width="136" height="136" rx="34" fill="#111720" stroke="#313A46"/>
    <g transform="translate(130 114)" filter="url(#shadow)">
      <path d="M-62 25C-28 25 -18 -56 0 -56C18 -56 28 25 62 25" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
      <path d="M-70 27H70" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.92"/>
      <circle cx="-61" cy="27" r="10" fill="url(#gold)"/>
      <circle cx="61" cy="27" r="10" fill="url(#gold)"/>
    </g>
    <text x="30" y="244" fill="#F7F8FB" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Kopru</text>
    <text x="30" y="286" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">Opket Love Bridge adina</text>
    <text x="30" y="315" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">dogrudan oturur.</text>
    <text x="30" y="377" fill="#FFD6A7" font-size="17" font-family="Segoe UI, Arial, sans-serif">Marka hikayesi icin en guzel secenek</text>
  </g>

  <g transform="translate(970 190)">
    <rect width="240" height="430" rx="30" fill="url(#card)" stroke="#303A49"/>
    <rect x="52" y="46" width="136" height="136" rx="34" fill="#111720" stroke="#313A46"/>
    <g transform="translate(120 114)" filter="url(#shadow)">
      <rect x="-44" y="-46" width="88" height="92" rx="22" stroke="url(#rose)" stroke-width="10"/>
      <path d="M-16 -8H16" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
      <path d="M-16 12H16" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
      <path d="M-12 -24L12 -24" stroke="url(#rose)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="58" r="12" fill="url(#rose)"/>
    </g>
    <text x="30" y="244" fill="#F7F8FB" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Oda Rozeti</text>
    <text x="30" y="286" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">Ozel alan, giris ve oda</text>
    <text x="30" y="315" fill="#A6B0BE" font-size="19" font-family="Segoe UI, Arial, sans-serif">mantigini daha net anlatir.</text>
    <text x="30" y="377" fill="#FFB8CB" font-size="17" font-family="Segoe UI, Arial, sans-serif">Sunucu-oda yapisina cok uygun</text>
  </g>
</svg>
